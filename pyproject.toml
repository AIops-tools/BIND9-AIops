[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bind9-aiops"
version = "0.1.0"
description = "Governed BIND 9 DNS diagnosis for service, zones, DNSSEC and SOA replication."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Wei Zhou", email = "zhouwei008@gmail.com" }]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "pyyaml>=6.0,<7.0",
    "mcp[cli]>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "bandit>=1.8,<2.0",
]

[project.scripts]
bind9-aiops = "bind9_aiops.cli:app"
bind9-aiops-mcp = "bind9_aiops.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["bind9_aiops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Vendored governance harness — kept faithful to its source; the exception
# names (PolicyDenied/BudgetExceeded) and a few long SQL/format lines are
# intentional and stable, so don't reflow them here.
"bind9_aiops/governance/*.py" = ["E501", "N818"]
# MCP server files are reflected by FastMCP/Pydantic; PEP 604 unions (X | None)
# crash on older mcp/pydantic, so they intentionally use Optional[X].
"bind9_aiops/mcp_server/**/*.py" = ["UP007", "UP045"]
# The MCP entry keeps an explicit Python-version guard even though the declared
# minimum is already 3.11.
"bind9_aiops/cli/_root.py" = ["UP036"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require a live BIND 9 server)",
]
